spring.application.name=chat-service

# ?? MongoDB ??????????????????????????????????????????????????
spring.data.mongodb.uri=mongodb://localhost:27017/chat_db

# ?? Redis ????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ?? Kafka Producer ???????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092

# Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Reliability: wait for all in-sync replicas to ack
spring.kafka.producer.acks=all

# Retry on transient failures
spring.kafka.producer.retries=3

# Type mapping ? tells consumer which class to deserialize to
spring.kafka.producer.properties.spring.json.type.mapping=chatMessage:com.shivamprogramming.chat_service.dto.ChatMessageEvent

# ?? Kafka Consumer ???????????????????????????????????????????
spring.kafka.consumer.group-id=chat-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.shivamprogramming.chat_service.*
spring.kafka.consumer.properties.spring.json.type.mapping=chatMessage:com.shivamprogramming.chat_service.dto.ChatMessageEvent

# ?? Kafka Topic Names ????????????????????????????????????????
kafka.topic.message-events=message-events

# Enable Kafka listener (set to false if Kafka broker is not running)
spring.kafka.listener.auto-startup=false

# ?? JWT Configuration ????????????????????????????????????????
# Base64-encoded secret key (must match the Auth/User service from Project 1)
jwt.secret=dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yand0YXV0aGVudGljYXRpb24xMjM0NTY3ODk=

# ?? File Upload ??????????????????????????????????????????????
chat.upload.dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ?? Server Port ??????????????????????????????????????????????
server.port=8080

# ?? Eureka (disable until server is ready) ???????????????????
eureka.client.enabled=false
